# Standalone sample checks; no AlphaCI registration, callbacks or deployment.
name: AlphaCI frontend demo (strict, no deployment)
'on':
  push:
    branches:
      - main
      - dev
      - uat
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  policy:
    uses: Alpha-Explora/alphaci-workflow/.github/workflows/branch-policy.yml@b107b06612c698fba7fd17463b2ffb3b575a87ee
    with:
      branch: main
      base-coverage-threshold: 85
  frontend-tests:
    uses: Alpha-Explora/alphaci-workflow/.github/workflows/frontend-tests.yml@b107b06612c698fba7fd17463b2ffb3b575a87ee
    with:
      working-directory: .
      system-name: OrderDesk-Frontend
      node-version: 24
      unit-tests-directory: tests/unit
      coverage-threshold: 95
      enforce-coverage: true
      test-command: >-
        npm run test -- --coverage --coverageReporters=json-summary --coverageReporters=lcov --json
        --outputFile=test-results.json
  frontend-lint:
    uses: Alpha-Explora/alphaci-workflow/.github/workflows/lint-check.yml@b107b06612c698fba7fd17463b2ffb3b575a87ee
    with:
      working-directory: .
      system-name: OrderDesk-Frontend
      node-version: 24
      lint-command: npm run lint
      fail-on-warning: true
  frontend-types:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run build
  frontend-audit:
    uses: Alpha-Explora/alphaci-workflow/.github/workflows/security-scan.yml@b107b06612c698fba7fd17463b2ffb3b575a87ee
    with:
      working-directory: .
      system-name: OrderDesk-Frontend
      node-version: 24
      fail-on-high: true
  frontend-sonar:
    uses: Alpha-Explora/alphaci-workflow/.github/workflows/sonarcloud-scan.yml@b107b06612c698fba7fd17463b2ffb3b575a87ee
    with:
      working-directory: .
      system-name: OrderDesk-Frontend
      sources-path: src
      tests-path: tests
      coverage-report-path: coverage/lcov.info
      coverage-artifact-name: OrderDesk-Frontend-coverage
      quality-gate-wait: true
    needs:
      - frontend-tests
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
      SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
  secrets:
    uses: Alpha-Explora/alphaci-workflow/.github/workflows/gitleaks-scan.yml@b107b06612c698fba7fd17463b2ffb3b575a87ee
    with:
      working-directory: .
      system-name: OrderDesk
      fail-on-findings: true
  frontend-browser:
    uses: Alpha-Explora/alphaci-workflow/.github/workflows/playwright-e2e.yml@b107b06612c698fba7fd17463b2ffb3b575a87ee
    with:
      working-directory: .
      system-name: OrderDesk-Frontend
      node-version: '24'
      run-only-on-branch: '*'
      e2e-tests-directory: tests/e2e
      browser-list: '["chromium"]'
      test-command: npm run test:e2e
  container-build:
    runs-on: ubuntu-latest
    needs:
      - policy
      - frontend-tests
      - frontend-lint
      - frontend-types
      - frontend-audit
      - frontend-sonar
      - secrets
      - frontend-browser
    steps:
      - uses: actions/checkout@v6
      - name: Build frontend image without publishing
        run: docker build --tag order-desk:demo .
      - name: Smoke-test container on the temporary runner
        run: |
          set -euo pipefail
          trap 'docker rm -f demo-app' EXIT
          docker run -d --name demo-app -p 18080:8080 order-desk:demo
          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/health; then ready=true; break; fi
            sleep 2
          done
          test "$ready" = true
          curl --fail --silent http://127.0.0.1:18080/ | grep -q '<div id="root"></div>'
